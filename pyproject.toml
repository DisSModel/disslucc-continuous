[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "disslucc-continuous"
version = "0.2.0"
description = "Continuous spatial LUCC models for DisSModel — CLUE-like allocation with linear regression potential"
readme = "README.md"
authors = [{ name = "Sergio Souza Costa", email = "sergio@ufma.br" }]
license = { text = "MIT" }
dependencies = [
    "dissmodel>=0.6.0,<0.7.0",
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "geopandas>=0.12.0",
    "rasterio>=1.3.0",
    "mapclassify>=2.4.0",
]
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "ruff>=0.0.200",
]
toolkit = [
    "tomli_w>=1.0.0",
    "streamlit>=1.30.0",
]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E701", "E241", "E203", "E501"]

[project.entry-points."dissmodel.executors"]
lucc_raster = "disslucc_continuous.executors.clue_like_raster_executor:LUCCRasterExecutor"
lucc_vector = "disslucc_continuous.executors.clue_like_vector_executor:LUCCVectorExecutor"
lucc_benchmark = "disslucc_continuous.executors.lucc_benchmark_executor:LUCCBenchmarkExecutor"